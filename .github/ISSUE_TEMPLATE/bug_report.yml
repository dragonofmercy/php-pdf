name: Bug report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much
        detail as possible so the issue can be reproduced and fixed quickly.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal code to reproduce
      description: The smallest PHP snippet that triggers the issue.
      render: php
      placeholder: |
        $doc = new Document();
        // ...
        $doc->save('out.pdf');
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include the full error message / stack trace if any.
    validations:
      required: true
  - type: input
    id: lib-version
    attributes:
      label: Library version
      placeholder: e.g. 1.11.0
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: e.g. 8.4.1
    validations:
      required: true
