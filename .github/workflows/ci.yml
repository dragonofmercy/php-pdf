name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: PHPStan & PHPUnit (PHP 8.4, ubuntu)
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install qpdf
        run: |
          sudo apt-get update && sudo apt-get install -y qpdf
          # Ubuntu 26 confines qpdf with AppArmor, which denies reading the extension-less tempnam() files under /tmp
          sudo aa-status 2>/dev/null | grep -i qpdf || echo "no qpdf AppArmor profile loaded"
          for profile in $(grep -lis qpdf /etc/apparmor.d/* 2>/dev/null); do echo "unloading $profile"; sudo apparmor_parser -R "$profile"; done

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run checks
        run: composer check
